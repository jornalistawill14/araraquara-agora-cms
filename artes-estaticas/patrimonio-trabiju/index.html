<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Patrimônio de Trabiju</title>
<link rel="stylesheet" href="fontes/fontes.css">
<style>
  /* Paleta tirada do próprio mural "Mapa Geral do Brasil" */
  :root {
    --papel: #efe4cb;
    --papel-claro: #f7f0de;
    --azul: #1d3f63;      /* Goiás */
    --azul-noite: #15243b; /* Rio Grande do Sul */
    --ocre: #dd9b21;      /* Mato Grosso */
    --ocre-escuro: #b0741a;
    --salvia: #96afa6;    /* Pará */
    --rosa: #d9b9b6;      /* Maranhão */
    --oceano: #a9bccb;
    --tinta: #22324a;
    --branco-logo: #fdfdfd; /* igual ao fundo da logo oficial */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  #arte {
    position: relative;
    width: 1080px; height: 1350px;
    overflow: hidden;
    background: var(--papel);
    font-family: 'Lora', serif;
    color: var(--tinta);
  }

  /* ---------- fundo: papel envelhecido + grade de azulejo ---------- */
  .fundo, .grade, .grao, .vinheta { position: absolute; inset: 0; pointer-events: none; }
  .fundo {
    background:
      radial-gradient(ellipse 70% 45% at 50% 60%, #f6eedb 0%, rgba(246,238,219,0) 70%),
      linear-gradient(180deg, #ede0c2 0%, #f1e6cf 40%, #eadbb9 100%);
  }
  .grade {
    background-image:
      linear-gradient(rgba(29,63,99,.055) 1.2px, transparent 1.2px),
      linear-gradient(90deg, rgba(29,63,99,.055) 1.2px, transparent 1.2px);
    background-size: 60px 60px;
    background-position: 0 0;
  }
  .grao { opacity: .5; mix-blend-mode: multiply; }
  .vinheta {
    background: radial-gradient(ellipse 85% 75% at 50% 48%, rgba(0,0,0,0) 55%, rgba(120,84,30,.22) 100%);
  }

  /* ---------- faixas de azulejo ---------- */
  .azulejo {
    position: absolute; left: 0; right: 0; height: 36px;
    background-image: var(--padrao-azulejo);
    background-size: 36px 36px;
    background-repeat: repeat-x;
    box-shadow: 0 2px 0 var(--ocre), 0 5px 0 var(--azul);
  }
  .azulejo.topo { top: 0; }
  .azulejo.base { top: 1120px; box-shadow: 0 -2px 0 var(--ocre), 0 -5px 0 var(--azul); }

  /* ---------- quadros ---------- */
  .parede {
    position: absolute; top: 60px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: flex-start; gap: 44px;
  }
  .quadro { position: relative; }
  .moldura {
    position: relative;
    padding: 15px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.18), rgba(0,0,0,.18)),
      repeating-linear-gradient(92deg, #7a4a24 0 3px, #6a3d1c 3px 7px, #825229 7px 9px, #6f411e 9px 13px);
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.45),
      inset 2px 2px 0 rgba(255,220,170,.25),
      0 22px 34px -12px rgba(70,40,10,.55),
      0 4px 8px rgba(70,40,10,.25);
  }
  .filete {
    padding: 3px;
    background: linear-gradient(135deg, #f0d48a, #b8862f 45%, #f3dc9c 70%, #a8761f);
    box-shadow: inset 0 0 0 1px rgba(80,50,10,.5);
  }
  .passe {
    background: #ffffff;
    padding: 12px;
    box-shadow: inset 0 0 6px rgba(0,0,0,.18);
  }
  .passe img { display: block; height: 386px; width: auto; }

  /* plaqueta de museu presa na moldura */
  .plaqueta {
    position: absolute; left: 50%; bottom: -46px; transform: translateX(-50%);
    width: calc(100% - 36px);
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px 9px 10px;
    background: linear-gradient(180deg, #fbf5e6, #efe3c6);
    border: 1.5px solid var(--azul);
    outline: 3px solid #fbf5e6;
    box-shadow: 0 0 0 4.5px var(--ocre), 0 10px 18px -6px rgba(60,35,5,.45);
    border-radius: 6px;
  }
  .plaqueta .icone {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #f2c066, var(--ocre) 55%, var(--ocre-escuro));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.3);
  }
  .plaqueta .icone svg { width: 27px; height: 27px; }
  .plaqueta .t1 {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 23px; letter-spacing: .005em;
    color: var(--azul); line-height: 1.1;
  }
  .plaqueta .t2 {
    font-family: 'Lora', serif; font-style: italic; font-weight: 500;
    font-size: 18px; color: #4a3a22; line-height: 1.2;
  }

  /* ---------- bloco de texto: certificado de época ---------- */
  .certificado {
    position: absolute; left: 64px; right: 64px; top: 598px; height: 470px;
    padding: 27px 48px 0;
    text-align: center;
    background: linear-gradient(180deg, rgba(252,247,235,.94), rgba(247,239,220,.94));
    border: 2px solid var(--azul);
    box-shadow:
      inset 0 0 0 7px rgba(252,247,235,.94),
      inset 0 0 0 8.5px var(--ocre),
      0 18px 32px -20px rgba(70,40,10,.6);
  }
  .canto {
    position: absolute; width: 34px; height: 34px;
    background-image: var(--padrao-azulejo); background-size: 34px 34px;
    outline: 2px solid var(--azul); outline-offset: 0;
    box-shadow: 0 0 0 4px #fbf6e9, 0 0 0 5.5px var(--ocre);
  }
  .canto.c1 { left: -18px; top: -18px; }
  .canto.c2 { right: -18px; top: -18px; }
  .canto.c3 { left: -18px; bottom: -18px; }
  .canto.c4 { right: -18px; bottom: -18px; }

  .chapeu {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-family: 'Lora', serif; font-weight: 600; font-size: 22px;
    letter-spacing: .42em; padding-left: .42em; color: var(--ocre-escuro);
  }
  .chapeu i { display: block; width: 64px; height: 1.5px; background: var(--ocre-escuro); position: relative; }
  .chapeu i::after {
    content: ""; position: absolute; top: -3.5px; width: 7px; height: 7px; background: var(--ocre);
    transform: rotate(45deg);
  }
  .chapeu i:first-child::after { left: -3px; }
  .chapeu i:last-child::after { right: -3px; }

  .patrimonio {
    margin-top: 4px;
    font-family: 'Playfair Display', serif; font-weight: 900;
    font-size: 98px; line-height: 1; letter-spacing: .035em; padding-left: .035em;
    color: var(--azul);
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }
  .qualificacao {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-top: 10px;
    font-family: 'Lora', serif; font-weight: 600; font-size: 23px;
    letter-spacing: .2em; padding-left: .2em; color: var(--azul-noite);
  }
  .qualificacao i { display: block; flex: none; width: 46px; height: 0; border-top: 1.5px solid var(--azul); border-bottom: 1.5px solid var(--azul); padding-top: 3px; box-sizing: content-box; }
  .de-trabiju {
    margin-top: 2px;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700;
    font-size: 50px; line-height: 1.08; color: var(--ocre-escuro);
  }
  .vinheta-texto { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 6px; }
  .vinheta-texto i { display: block; width: 150px; height: 1px; background: linear-gradient(90deg, rgba(29,63,99,0), rgba(29,63,99,.6)); }
  .vinheta-texto i:last-child { transform: scaleX(-1); }
  .vinheta-texto svg { width: 18px; height: 18px; }

  .leis { font-family: 'Lora', serif; font-size: 24px; line-height: 1.34; font-weight: 500; color: #3a3226; }
  .leis strong { font-weight: 600; color: var(--azul); }

  .faixa {
    position: absolute; left: 13px; right: 13px; bottom: 13px;
    padding: 13px 20px 14px;
    background: var(--azul);
    color: #f7f0de;
    font-family: 'Lora', serif; font-size: 23px; line-height: 1.3; font-weight: 500;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.06), inset 0 0 0 1px rgba(221,155,33,.55);
  }
  .faixa em {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700;
    font-size: 27px; color: #f2b84b;
  }

  /* ---------- rodapé com a logo oficial (sem alteração) ---------- */
  .rodape {
    position: absolute; left: 0; right: 0; top: 1156px; bottom: 0;
    background: var(--branco-logo);
    display: grid; place-items: center;
  }
  .rodape img { display: block; width: 703px; height: 185px; image-rendering: auto; }
</style>
</head>
<body>
<div id="arte">
  <div class="fundo"></div>
  <div class="grade"></div>
  <svg class="grao" width="1080" height="1350" aria-hidden="true">
    <filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .16  0 0 0 .55 0"/></filter>
    <filter id="manchas"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .40  0 0 0 0 .15  0 0 0 .35 -.05"/></filter>
    <rect width="100%" height="100%" filter="url(#manchas)"/>
    <rect width="100%" height="100%" filter="url(#ruido)" opacity=".55"/>
  </svg>
  <div class="vinheta"></div>

  <div class="azulejo topo"></div>

  <!-- quadros: fotos originais, sem filtro nem retoque -->
  <div class="parede">
    <figure class="quadro">
      <div class="moldura"><div class="filete"><div class="passe">
        <img src="fotos/quadro-diplomandos-1955.jpg" alt="Quadro Diplomandos de 1955 do Grupo Escolar de Trabiju">
      </div></div></div>
      <figcaption class="plaqueta">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="#fbf5e6"><path d="M12 3.6 0.8 9.1 12 14.6l9.2-4.5v5.6h1.6V9.1z"/><path d="M5.4 12v3.6c0 1.7 3 3.4 6.6 3.4s6.6-1.7 6.6-3.4V12L12 15.3z"/></svg>
        </span>
        <span><span class="t1">Diplomandos de 1955</span><br><span class="t2">do Grupo Escolar de Trabiju</span></span>
      </figcaption>
    </figure>

    <figure class="quadro">
      <div class="moldura"><div class="filete"><div class="passe">
        <img src="fotos/mural-mapa-geral-do-brasil.png" alt="Pintura Mapa Geral do Brasil">
      </div></div></div>
      <figcaption class="plaqueta">
        <span class="icone">
          <svg viewBox="0 0 24 24"><path fill="#fbf5e6" d="M12 2.8C6.6 2.8 2.4 6.6 2.4 11.4c0 4.5 3.6 8.4 8.2 8.4 1.4 0 2.1-.9 2.1-1.9 0-.5-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.9-1.8h2.3c3.1 0 5.7-2.4 5.7-5.7C21.6 5.7 17.4 2.8 12 2.8z"/><circle cx="7.2" cy="11" r="1.5" fill="#b0741a"/><circle cx="9.6" cy="7.2" r="1.5" fill="#1d3f63"/><circle cx="14.4" cy="6.8" r="1.5" fill="#b0741a"/><circle cx="17.6" cy="10" r="1.5" fill="#1d3f63"/></svg>
        </span>
        <span><span class="t1">“Mapa Geral do Brasil”</span><br><span class="t2">pintura de 1942</span></span>
      </figcaption>
    </figure>
  </div>

  <!-- bloco de texto -->
  <section class="certificado">
    <i class="canto c1"></i><i class="canto c2"></i><i class="canto c3"></i><i class="canto c4"></i>
    <div class="chapeu"><i></i>AGORA É<i></i></div>
    <h1 class="patrimonio">PATRIMÔNIO</h1>
    <div class="qualificacao"><i></i>HISTÓRICO, CULTURAL E MATERIAL<i></i></div>
    <div class="de-trabiju">de Trabiju</div>
    <div class="vinheta-texto">
      <i></i>
      <svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9 2.3-2.3 9 0 2.3 2.3 0 9-2.3 2.3-9 0-2.3-2.3z" fill="#1d3f63"/><circle r="2.2" fill="#dd9b21"/></svg>
      <i></i>
    </div>
    <p class="leis">Leis reconhecem quadros localizados na<br><strong>E.E. “Alfredo Evangelista Nogueira”</strong></p>
    <p class="faixa">Os dois quadros foram considerados<br><em>patrimônio histórico do município.</em></p>
  </section>

  <div class="azulejo base"></div>
  <div class="rodape">
    <img src="fotos/logo-prefeitura-trabiju.png" alt="Prefeitura de Trabiju — Nossa cidade, nosso orgulho, nosso progresso — Administração 2025-2028">
  </div>
</div>

<script>
  // padrão de azulejo (inspirado nos azulejos de parede escolares)
  const azulejo = `<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'>
    <rect width='36' height='36' fill='#f6eedb'/>
    <g fill='#1d3f63'>
      <path d='M0 0h9a9 9 0 0 1-9 9z'/><path d='M36 0v9a9 9 0 0 1-9-9z'/>
      <path d='M0 36v-9a9 9 0 0 1 9 9z'/><path d='M36 36h-9a9 9 0 0 1 9-9z'/>
      <path d='M18 6c2.6 3.4 2.6 8.6 0 12-2.6-3.4-2.6-8.6 0-12z'/>
      <path d='M18 30c-2.6-3.4-2.6-8.6 0-12 2.6 3.4 2.6 8.6 0 12z'/>
      <path d='M6 18c3.4-2.6 8.6-2.6 12 0-3.4 2.6-8.6 2.6-12 0z'/>
      <path d='M30 18c-3.4 2.6-8.6 2.6-12 0 3.4-2.6 8.6-2.6 12 0z'/>
    </g>
    <circle cx='18' cy='18' r='2.6' fill='#dd9b21'/>
    <g fill='#dd9b21'><circle cx='0' cy='0' r='3'/><circle cx='36' cy='0' r='3'/><circle cx='0' cy='36' r='3'/><circle cx='36' cy='36' r='3'/></g>
    <rect width='36' height='36' fill='none' stroke='#1d3f63' stroke-opacity='.35' stroke-width='.8'/>
  </svg>`;
  document.documentElement.style.setProperty('--padrao-azulejo', `url("data:image/svg+xml,${encodeURIComponent(azulejo)}")`);

</script>
</body>
</html>
